<style>
/* VOICE: quiet, antique, a companion you read by lamplight.
   IDEA: the little printed guidebook that ships inside a vintage tarot box.
   PICTURE: each page carries an engraved-style card — sunburst, numeral, emblem, name ribbon.
   COLOUR and TYPE: aged parchment, sepia-black ink, a deep night-blue cover with gold — the deck's own palette; IM Fell + Cormorant.
   LAYOUT: one card per page on phones, a two-page spread on wide screens; contents page with clickable keywords. */
:root{color-scheme:light;
 --ground:light-dark(#d6c4a0,#15120e);
 --paper:light-dark(#f2e7cd,#e8dabb);
 --paper2:light-dark(#e9d9b6,#dccaa5);
 --ink:#2a2119; --ink2:#5b4a38;
 --night:#1b2130; --gold:#c9a45c;
 --yes:#3f5a2e; --no:#7a2f22;
 --chrome:light-dark(#2a2119,#e8dabb); --chromebg:light-dark(#efe3c6,#211c16)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:500 18px/1.45 "Cormorant Garamond",Georgia,serif;overflow:hidden;display:grid;grid-template-rows:minmax(0,1fr) auto;height:100dvh}
.book{display:flex;justify-content:center;align-items:stretch;padding:12px 12px 6px;min-height:0;perspective:1400px}
.pg{display:none;flex-direction:column;width:min(100%,520px);max-height:880px;margin:auto 0;height:100%;background:radial-gradient(120% 90% at 50% 40%,var(--paper),var(--paper2));border-radius:6px;box-shadow:0 10px 30px rgba(20,12,4,.28),inset 0 0 0 1px rgba(42,33,25,.15);padding:14px 20px 10px;position:relative;overflow:hidden}
.pg::before{content:"";position:absolute;inset:8px;border:1px solid rgba(42,33,25,.35);border-radius:3px;pointer-events:none}
.pg.on{display:flex}
.spread .pg.on{width:min(47vw,540px)}
.spread .pg.on.l{border-radius:6px 0 0 6px;box-shadow:0 10px 30px rgba(20,12,4,.28),inset -18px 0 22px -18px rgba(42,33,25,.45)}
.spread .pg.on.r{border-radius:0 6px 6px 0;box-shadow:0 10px 30px rgba(20,12,4,.28),inset 18px 0 22px -18px rgba(42,33,25,.45)}
.rh,.pf{display:flex;justify-content:space-between;font:15px "IM Fell English SC",serif;color:var(--ink2);flex:none;padding:0 6px}
.pf{justify-content:center}
.fig{flex:1 1 0;min-height:110px;display:flex;justify-content:center;align-items:center;padding:6px 0}
.fig svg{height:100%;width:auto;max-width:100%;filter:drop-shadow(0 3px 6px rgba(42,33,25,.25))}
.tx{flex:none;text-align:center;padding:0 8px 6px;min-height:clamp(200px,31vh,240px);display:flex;flex-direction:column;justify-content:flex-start}
.lbl{margin:0;font:italic 15px "IM Fell English",serif;color:var(--ink2)}
h2{margin:0;font:400 clamp(28px,7vw,38px)/1.05 "IM Fell English SC",serif;text-wrap:balance}
.kw{margin:4px 0 6px;font:600 16px "Cormorant Garamond",serif;letter-spacing:.02em;color:var(--ink2)}
.mn{margin:0 auto;max-width:30ch;font:italic 500 19px/1.3 "Cormorant Garamond",serif}
.dt{margin:6px auto 0;max-width:38ch;font:500 16px/1.38 "Cormorant Garamond",serif;color:var(--ink2)}
.ans{margin:6px 0 0;font:16px "IM Fell English",serif}
.ans b{font:400 22px "IM Fell English SC",serif;margin-right:4px}
.ans.y b{color:var(--yes)}.ans.n b{color:var(--no)}
svg .rd{fill:#8a2418}
svg .cf{fill:#efe2c4}
svg .rl{stroke:#8a2418;stroke-width:1.1}
svg .cl{fill:none;stroke:var(--ink);stroke-width:.8}
svg .ray line{stroke:var(--ink);stroke-width:.55;opacity:.38}
svg .cn,svg .ct{font-family:"IM Fell English SC",serif;fill:var(--ink);text-anchor:middle}
svg .cn{font-size:18px}svg .ct{font-size:13.5px;letter-spacing:.06em}
svg .disc{fill:#efe2c4;stroke:var(--ink);stroke-width:1.3}
svg .disc2{fill:none;stroke:var(--ink);stroke-width:.6}
svg .gl{font:44px "Segoe UI Symbol","Noto Sans Symbols",serif;fill:var(--ink);text-anchor:middle}
svg .el{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
svg .bk{fill:#efe2c4}
svg .pip{stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
svg .rk{font:15px "IM Fell English SC",serif;fill:var(--ink);text-anchor:middle}
/* cover */
.cover{background:#0b0a09!important;text-align:center;justify-content:center}
.cover::before{border-color:rgba(201,164,92,.35)}
.cover .stamp{width:min(50%,210px);margin:0 auto;display:block;filter:drop-shadow(0 6px 14px rgba(0,0,0,.6))}
.cover .hi{margin:18px 0 0;font:400 22px/1 "Tiro Devanagari Hindi",serif;color:#e8dabb;letter-spacing:.08em}
.cover h1{margin:10px 0 4px;font:400 clamp(34px,9vw,50px)/1.02 "IM Fell English SC",serif;text-wrap:balance}
.cover p{margin:4px auto;max-width:30ch;font:italic 18px/1.35 "Cormorant Garamond",serif;color:#e4d3a8}
.cover .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.cover a{font:17px "IM Fell English SC",serif;color:var(--night);background:var(--gold);padding:10px 18px;border-radius:3px;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.cover a.alt{background:none;color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
/* contents */
.contents h2{text-align:center;margin-top:6px}
.contents .note{margin:2px 8px 8px;text-align:center;font:italic 15px/1.3 "Cormorant Garamond",serif;color:var(--ink2)}
.contents input{font:16px "Cormorant Garamond",serif;width:calc(100% - 16px);margin:0 8px 8px;padding:10px 12px;min-height:44px;border:1px solid rgba(42,33,25,.4);border-radius:3px;background:rgba(255,250,235,.6);color:var(--ink)}
.contents input:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid #8a5a2b;outline-offset:2px}
.list{flex:1 1 0;overflow-y:auto;padding:0 8px 8px;overscroll-behavior:contain}
.list h3{margin:14px 0 4px;font:400 20px "IM Fell English SC",serif;border-bottom:1px solid rgba(42,33,25,.35);display:flex;justify-content:space-between}
.list h3 small{font:italic 14px "Cormorant Garamond",serif;color:var(--ink2)}
.list ul{list-style:none;margin:0;padding:0}
.ir{display:grid;grid-template-columns:2.6em minmax(0,1fr) auto;gap:2px 8px;padding:6px 0;border-bottom:1px dotted rgba(42,33,25,.25);align-items:baseline}
.ir .in{font:15px "IM Fell English SC",serif;color:var(--ink2)}
.ir .nm{font:19px "IM Fell English",serif;color:var(--ink);text-decoration:none}
.ir .yn{font:14px "IM Fell English SC",serif}.ir .yn.y{color:var(--yes)}.ir .yn.n{color:var(--no)}
.kws{grid-column:2/4;display:flex;flex-wrap:wrap;gap:4px 6px}
.kws a{font:600 14.5px "Cormorant Garamond",serif;color:var(--ink2);text-decoration:none;border:1px solid rgba(42,33,25,.3);border-radius:20px;padding:1px 9px}
.kws a:hover,.ir .nm:hover{color:#8a3b1f}
.empty{text-align:center;font-style:italic;color:var(--ink2);display:none}
.spin{align-items:center;text-align:center}
.spin .note{margin:0 0 4px;font:italic 15px "Cormorant Garamond",serif;color:var(--ink2)}
.wheel{position:relative;width:min(100%,42vh,400px);aspect-ratio:1;margin:4px auto 12px;flex:none;border-radius:50%}
#wheel{width:100%;height:100%;display:block;pointer-events:none;transition:transform 4.2s cubic-bezier(.12,.7,.1,1);filter:drop-shadow(0 4px 8px rgba(42,33,25,.3))}
.ptr{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border:11px solid transparent;border-top:20px solid #8a2418;border-bottom:0;z-index:2}
#wheel .wg{font:9.5px "Segoe UI Symbol","Noto Sans Symbols",serif;fill:#f2e7cd;text-anchor:middle}
#wheel .wr{font:6.4px "IM Fell English SC",serif;fill:#2a2119;text-anchor:middle}
#wheel .wp{stroke:#2a2119;fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
#spinbtn{position:absolute;z-index:3;left:38%;top:38%;width:24%;height:24%;border-radius:50%;border:0;background:transparent;cursor:pointer;padding:0;display:grid;place-items:center}
#spinbtn svg{width:78%;height:78%;fill:none;stroke:#2a2119;stroke-width:2;stroke-linecap:round}
#spinbtn .pu{fill:#2a2119}
#spinbtn:hover svg,#spinbtn:focus-visible svg{stroke:#8a2418}#spinbtn:hover .pu{fill:#8a2418}
#spinbtn:disabled{cursor:default}#spinbtn:disabled .pu{animation:pu 1s ease-in-out infinite}
@keyframes pu{50%{transform:scale(.4);transform-origin:30px 30px}}
.res{flex:1 1 0;min-height:0;overflow:auto;width:100%;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;text-align:start;padding:10px 8px 4px}
.res:empty{display:block}
.res .rfig svg{height:min(150px,18vh);width:auto;display:block}
.res h3{margin:0;font:400 24px/1.1 "IM Fell English SC",serif}
.res .kw,.res .mn,.res .ans,.res .dt{text-align:start;margin-left:0}
.res a{font:16px "IM Fell English",serif;color:#8a2418}
@media(prefers-reduced-motion:reduce){#wheel{transition:none}}
/* controls */
nav{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto auto auto;gap:6px;align-items:center;padding:6px 12px max(8px,env(safe-area-inset-bottom));max-width:760px;width:100%;margin:0 auto}
nav button{font:17px "IM Fell English SC",serif;min-height:44px;min-width:44px;padding:0 12px;border:1px solid rgba(42,33,25,.35);border-radius:3px;background:var(--chromebg);color:var(--chrome);cursor:pointer}
:root[data-theme=dark] nav button{border-color:rgba(232,218,187,.3)}
#spinnav svg{width:26px;height:26px;display:block;fill:none;stroke:currentColor;stroke-width:3.2}
nav button:disabled{opacity:.35;cursor:default}
#count{text-align:center;font:italic 16px "Cormorant Garamond",serif;color:var(--chrome);white-space:nowrap}
.turn-n{animation:tn .38s ease-out}.turn-p{animation:tp .38s ease-out}
@keyframes tn{from{opacity:.2;transform:rotateY(-14deg) translateX(18px)}}
@keyframes tp{from{opacity:.2;transform:rotateY(14deg) translateX(-18px)}}
@media(prefers-reduced-motion:reduce){.turn-n,.turn-p{animation:none}}
@media(max-height:620px){.mn{font-size:17px}.kw{margin:2px 0 4px}h2{font-size:26px}}
</style>
</head>

function render(dir){
 const sp=mq.matches;book.classList.toggle("spread",sp);
 const L=sp?cur-cur%2:cur,vis=sp?[L,L+1]:[cur];
 els.forEach((e,i)=>{const on=vis.includes(i)&&i<els.length;e.classList.toggle("on",on);e.classList.toggle("l",sp&&i===L);e.classList.toggle("r",sp&&i===L+1);e.classList.remove("turn-n","turn-p");if(on&&dir){void e.offsetWidth;e.classList.add(dir>0?"turn-n":"turn-p")}});
 count.textContent=sp?`pp. ${L+1}–${Math.min(L+2,els.length)} of ${els.length}`:`${cur+1} / ${els.length}`;
 prev.disabled=(sp?L:cur)<=0;next.disabled=(sp?L+2:cur+1)>=els.length;
}
function go(i,dir){
 i=Math.max(0,Math.min(els.length-1,i));
 if(i===cur)return;
 const d=dir??(i>cur?1:-1);cur=i;render(d);
 const id=pages[cur].id;if(location.hash.slice(1)!==id)location.hash=id;
}
const step=d=>{const sp=mq.matches,L=sp?cur-cur%2:cur;go(L+d*(sp?2:1),d)};
const fromHash=()=>{const id=location.hash.slice(1),i=pages.findIndex(p=>p.id===id);go(i<0?0:i)};
prev.onclick=()=>step(-1);next.onclick=()=>step(1);
document.getElementById("first").onclick=()=>go(0,-1);
document.getElementById("toc").onclick=()=>go(1);
document.getElementById("spinnav").onclick=()=>go(2);
const wheel=document.getElementById("wheel"),sb=document.getElementById("spinbtn"),res=document.getElementById("res");
let rot=0;
sb.onclick=()=>{
 const r=new Uint32Array(2);crypto.getRandomValues(r);
 const i=r[0]%N,jit=((r[1]%1000)/1000-.5)*SEG*.7,center=(i+.5)*SEG;
 const base=rot-((rot%360)+360)%360;rot=base+360*6+((360-center+jit)%360+360)%360;
 sb.disabled=true;res.innerHTML="";void wheel.getBoundingClientRect();wheel.style.transform=`rotate(${rot}deg)`;
 const done=()=>{const c=cards[i];sb.disabled=false;res.innerHTML=`<div class="rfig">${figure(c)}</div><div><h3>${c.name}</h3><p class="kw">${c.kw.join(" · ")}</p><p class="mn">${c.mean}</p><p class="dt">${c.det}</p><p class="ans ${c.yn==="Yes"?"y":"n"}">${ynTxt(c)}</p><a href="#${c.id}">Open card page →</a></div>`};
 let fired=false;const fin=()=>{if(fired)return;fired=true;wheel.removeEventListener("transitionend",fin);clearTimeout(t);done();res.scrollTop=0};
 const instant=matchMedia("(prefers-reduced-motion: reduce)").matches||getComputedStyle(wheel).transitionDuration==="0s";
 wheel.addEventListener("transitionend",fin);const t=setTimeout(fin,instant?30:4600);
};
addEventListener("hashchange",fromHash);
mq.addEventListener("change",()=>render(0));
addEventListener("keydown",e=>{if(e.target===q)return;if(e.key==="ArrowRight")step(1);if(e.key==="ArrowLeft")step(-1)});
let tx=0,ty=0;
book.addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
book.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3)step(dx<0?1:-1)},{passive:true});
fromHash();

try{if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")&&!/claude|anthropic/.test(location.hostname))navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(_){}
}
</script>
</body>
</html>
